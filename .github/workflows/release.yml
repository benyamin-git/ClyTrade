name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi

  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    needs: [preflight, checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: ./.github/actions/setup

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        run: npm run tauri:build

      - name: Collect artifacts
        run: node scripts/collect-artifacts.mjs windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clytrade-windows
          path: release/*
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    needs: [preflight, checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: ./.github/actions/setup

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/android-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Configure Android NDK
        run: |
          NDK_HOME="${NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_HOME" ]; then
            echo "No Android NDK found on the runner" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using NDK_HOME=$NDK_HOME"

      - name: Build
        run: npm run android:apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Collect artifacts
        run: node scripts/collect-artifacts.mjs android

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clytrade-android
          path: release/*
          if-no-files-found: error

      - name: Remove Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.keystore"

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: "${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}"
          generate_release_notes: true
          name: ClyTrade ${{ github.ref_name }}
          files: release/*
