name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check formatting
        run: npm run format:check

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri:build

      - name: Collect artifacts
        run: node scripts/collect-artifacts.mjs windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clytrade-windows
          path: release/*
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android NDK
        run: |
          NDK_HOME="${NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$NDK_HOME" ]; then
            echo "No Android NDK found on the runner" >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "Using NDK_HOME=$NDK_HOME"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run android:apk

      - name: Collect artifacts
        run: node scripts/collect-artifacts.mjs android

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clytrade-android
          path: release/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: "${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}"
          generate_release_notes: true
          name: ClyTrade ${{ github.ref_name }}
          files: release/*
