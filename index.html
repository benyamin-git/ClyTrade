<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="ClyTrade — fast, local-first trading journal, portfolio and calculators."
    />
    <meta name="theme-color" content="#1c1b1f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClyTrade" />
    <title>ClyTrade</title>
    <script>
      ;(function () {
        try {
          var config = __THEME_INIT__
          var stored = localStorage.getItem('clytrade.theme')
          if (stored !== null && Object.hasOwn(config.themeMigrations, stored)) {
            stored = config.themeMigrations[stored]
          }
          var theme =
            config.themes.indexOf(stored) === -1
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? config.lightTheme
                : config.darkTheme
              : stored
          var dark = config.darkThemes.indexOf(theme) !== -1
          document.documentElement.dataset.theme = theme
          if (window.ClyTradeNative) {
            window.ClyTradeNative.setDarkTheme(dark)
          }
          var statusBar = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          )
          if (statusBar) {
            statusBar.setAttribute('content', dark ? 'black-translucent' : 'default')
          }
          var surface = config.surfaces[theme]
          if (surface) {
            var themeColor = document.querySelector('meta[name="theme-color"]')
            if (themeColor) themeColor.setAttribute('content', surface)
          }
          var accent = localStorage.getItem('clytrade.accent')
          if (accent !== config.nativeAccent) {
            document.documentElement.dataset.accent =
              config.accents.indexOf(accent) === -1 ? config.defaultAccent : accent
          }
          var language = localStorage.getItem('clytrade.language')
          if (language !== 'en' && language !== 'fa') {
            language = (navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en'
          }
          document.documentElement.lang = language
          document.documentElement.dir = language === 'fa' ? 'rtl' : 'ltr'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.dataset.accent = 'blue'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
