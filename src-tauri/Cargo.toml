[package]
name = "clytrade"
version = "0.1.0"
description = "Fast, local-first trading journal, portfolio tracker and calculator suite."
authors = ["benyamin-git"]
license = "GPL-3.0-only"
repository = "https://github.com/benyamin-git/ClyTrade"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clytrade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
